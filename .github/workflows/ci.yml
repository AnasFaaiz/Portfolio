name: Frontend CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest


        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: 'npm'
                cache-dependency-path: portfolio/package-lock.json
            - name: Install dependencies
              working-directory: portfolio
              run: npm ci
            - name: Lint Code
              working-directory: portfolio
              run: npm run lint
            - name: Build Project
              working-directory: portfolio
              run: npm run build